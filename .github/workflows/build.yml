name: Build APK

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.appversion.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEY_STORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️ RELEASE_KEY_STORE_BASE64 未设置，将使用 debug 签名"
            exit 0
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > $GITHUB_WORKSPACE/release.keystore

          STORE_PW=$(printf '%s' "$STORE_PW" | tr -d '[:space:]')
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          KEY_PW=$(printf '%s' "$KEY_PW" | tr -d '[:space:]')

          cat >> local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=$STORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF

          echo "✅ 签名配置完成"

      - name: Resolve version name
        id: appversion
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          NAME="${VERSION_NAME}.${{ github.run_number }}"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "APP_VERSION_NAME=$NAME" >> $GITHUB_ENV
          echo "构建版本号: $NAME (code: $VERSION_CODE)"

      - name: Build Mobile Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleMobileRelease --no-daemon -x lint

      - name: Build Leanback Release APK
        run: |
          ./gradlew assembleLeanbackRelease --no-daemon -x lint

      - name: Rename APK Files
        env:
          APP_VERSION_NAME: ${{ steps.appversion.outputs.name }}
        run: |
          mkdir -p release-apks

          # Mobile APK
          MOBILE_APK=$(find app/build/outputs/apk/mobile/release -name "*.apk" -type f | head -1)
          if [ -n "$MOBILE_APK" ]; then
            cp "$MOBILE_APK" "release-apks/TV-Mobile-${APP_VERSION_NAME}.apk"
            echo "✅ Mobile APK: $MOBILE_APK"
          fi

          # Leanback APK
          LEANBACK_APK=$(find app/build/outputs/apk/leanback/release -name "*.apk" -type f | head -1)
          if [ -n "$LEANBACK_APK" ]; then
            cp "$LEANBACK_APK" "release-apks/TV-Leanback-${APP_VERSION_NAME}.apk"
            echo "✅ Leanback APK: $LEANBACK_APK"
          fi

          ls -la release-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-release-apk
          path: release-apks/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: tv-release-apk
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          body: |
            ## Release v${{ needs.build.outputs.version }}

            **Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            **Commit:** ${{ github.sha }}

            ### 📦 Downloads
            - **TV-Mobile:** 手机/平板版本
            - **TV-Leanback:** 电视版本
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
